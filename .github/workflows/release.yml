name: Release

# 打 tag(v*)→ 在 macOS runner 上打包 dmg + zip(arm64 + x64)并挂到对应 Release。
# 也可在 Actions 页手动触发(workflow_dispatch)做一次构建烟测(不发布,只产出 CI 工件)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 需要写权限才能创建/更新 Release 并上传资产

jobs:
  build-macos:
    runs-on: macos-14 # Apple Silicon runner;electron-builder 在其上交叉构建 x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript → dist)
        run: npm run build:prod

      - name: Package (dmg + zip · arm64 + x64)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # 无证书:别去找/试图签名

      - name: Upload build artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: clipeek-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          fail_on_unmatched_files: true
          body: |
            macOS · 未签名 · Apple Silicon (arm64) + Intel (x64) · dmg + zip

            **安装**(未签名,首次需放行一次):右键点 **clipeek.app → 打开 → 打开**,或终端执行 `xattr -dr com.apple.quarantine /Applications/clipeek.app`。

            需要 [Claude Code](https://claude.com/claude-code);单击灯跳转终端标签页需 [Warp](https://www.warp.dev/) ≥ `2026.05.27`。
