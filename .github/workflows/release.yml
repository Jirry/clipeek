name: Release

# 打 tag(v*)→ 在 macOS runner 上打包 dmg + zip(arm64 + x64)并挂到对应 Release。
# 也可在 Actions 页手动触发(workflow_dispatch)做一次构建烟测(不发布,只产出 CI 工件)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 需要写权限才能创建/更新 Release 并上传资产

jobs:
  build-macos:
    runs-on: macos-14 # Apple Silicon runner(秒启动;macos-13 当前排队拿不到机器)。DMG 的 hdiutil 偶发失败靠下方重试兜
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # 用 npm install 而非 npm ci:lockfile 缺 vitest 带来的 esbuild 0.28 跨平台可选依赖,
        # npm ci(严格)会报「Missing @esbuild/* from lock file」(macOS 上也会)。与 ci.yml 一致。
        run: npm install --no-audit --no-fund

      - name: Build (TypeScript → dist)
        run: npm run build:prod

      - name: Package (dmg + zip · arm64 + x64)
        # GitHub runner 上 hdiutil 偶发 "Device not configured" → 整体重试至多 3 次
        run: |
          for i in 1 2 3; do
            echo "::group::electron-builder attempt $i"
            if npx electron-builder --mac --publish never; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "attempt $i failed; retrying in 20s…"; sleep 20
          done
          echo "all 3 attempts failed"; exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # 无证书:别去找/试图签名

      - name: Upload build artifacts (CI)
        if: github.event_name == 'workflow_dispatch' # 仅手动验证时存工件;tag 正式发布走下面的 Release,不重复双存
        uses: actions/upload-artifact@v4
        with:
          name: clipeek-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
          fail_on_unmatched_files: true
          body: |
            ### 📦 下载

            | 你的 Mac | 安装包 (dmg) | 免安装 (zip) |
            | --- | --- | --- |
            | Apple 芯片(M1/M2/M3…) | `CliPeek-*-arm64.dmg` | `CliPeek-*-arm64.zip` |
            | Intel | `CliPeek-*-x64.dmg` | `CliPeek-*-x64.zip` |

            👇 从下方 **Assets** 里下载对应文件(`dmg` = 安装包,`zip` = 免安装)。

            ### ⚠️ macOS 首次启动

            应用未做 Apple 签名,首次打开会被 Gatekeeper 拦。装好后在终端执行一次:

            ```sh
            xattr -dr com.apple.quarantine /Applications/CliPeek.app
            ```

            之后正常双击即可打开。

            ### 🔄 关于

            **CliPeek**(瞄一眼)—— 常驻角落的悬浮 HUD,把本地 AI CLI(Claude Code)会话显示成红绿灯;点灯跳到对应终端,`⌘J` 智能跳到最需要关注的会话、`⌘⇧J` 全量循环(均可在设置里改键)。需 [Claude Code](https://claude.com/claude-code);跳转终端需 [Warp](https://www.warp.dev/) ≥ `2026.05.27`。
