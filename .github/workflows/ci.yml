name: CI

# push 到 main / 任何 PR → 类型检查 + 单测 + 构建,拦住状态/判活逻辑的回退。
# 跑在 ubuntu(测试是纯 JS/TS、跨平台,比 macOS runner 快且省;打包发版另见 release.yml)。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # 用 npm install 而非 npm ci:vitest 带进来的 esbuild 0.28 跨平台可选依赖在 lockfile 里不全
        # (mac 上生成的锁文件没记 linux 的 @esbuild/linux-*),npm ci 会因此在 linux 上报错;
        # npm install 按当前平台需要补齐即可,CI 测试用足够。
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
